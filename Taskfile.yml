version: "3"

vars:
  COMPOSE:
    sh: |
      if command -v podman >/dev/null 2>&1 && podman compose version >/dev/null 2>&1; then
        echo "podman compose"
      elif command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
        echo "docker compose"
      fi

tasks:
  generate:
    desc: Run all codegen (API types + DB types)
    cmds:
      - task: "generate:api"
      - task: "generate:db"

  "generate:api":
    desc: Run API codegen for server package
    dir: server
    cmds:
      - pnpm run generate:api

  "generate:db:compose:up":
    desc: Start a temporary database for schema codegen and wait for readiness
    dir: server
    internal: true
    preconditions:
      - sh: test -n "{{.COMPOSE}}"
        msg: Neither 'podman compose' nor 'docker compose' is available.
    cmds:
      - "{{.COMPOSE}} -f docker-compose.test.yml up -d"
      - |
        i=0
        while [ "$i" -lt 60 ]; do
          if {{.COMPOSE}} -f docker-compose.test.yml exec -T corncrakeci-test-postgres \
            pg_isready -U corncrakecitest -d corncrakecitest >/dev/null 2>&1; then
            exit 0
          fi
          i=$((i + 1))
          sleep 1
        done

        echo "Postgres container did not become ready in time." >&2
        exit 1

  "generate:db:compose:down":
    desc: Stop the temporary database used for schema codegen
    dir: server
    internal: true
    preconditions:
      - sh: test -n "{{.COMPOSE}}"
        msg: Neither 'podman compose' nor 'docker compose' is available.
    cmds:
      - "{{.COMPOSE}} -f docker-compose.test.yml down -v --remove-orphans"

  "generate:db":
    desc: Generate Kysely types from the database schema (migrate a temp DB, then run Kanel)
    dir: server
    sources:
      - migrations/*.sql
      - .kanelrc.cjs
    generates:
      - src/db/schema/**/*.ts
    env:
      DB_URI: postgresql://corncrakecitest:corncrakecitest@localhost:15432/corncrakecitest
    cmds:
      - defer: { task: "generate:db:compose:down" }
      - task: "generate:db:compose:up"
      - pnpm run migrate
      - pnpm run generate:db:types

  "test:compose:up":
    desc: Start test database via compose and wait for readiness
    dir: server
    preconditions:
      - sh: test -n "{{.COMPOSE}}"
        msg: Neither 'podman compose' nor 'docker compose' is available.
    cmds:
      - 'echo "Using compose via: {{.COMPOSE}}"'
      - "{{.COMPOSE}} -f docker-compose.test.yml up -d"
      - |
        i=0
        while [ "$i" -lt 60 ]; do
          if {{.COMPOSE}} -f docker-compose.test.yml exec -T corncrakeci-test-postgres \
            pg_isready -U corncrakecitest -d corncrakecitest >/dev/null 2>&1; then
            exit 0
          fi
          i=$((i + 1))
          sleep 1
        done

        echo "Postgres test container did not become ready in time." >&2
        exit 1

  "test:compose:down":
    desc: Stop test database compose stack
    dir: server
    preconditions:
      - sh: test -n "{{.COMPOSE}}"
        msg: Neither 'podman compose' nor 'docker compose' is available.
    cmds:
      - "{{.COMPOSE}} -f docker-compose.test.yml down -v --remove-orphans"

  test:
    desc: Run server tests (generate first, then run with test DB compose stack)
    deps:
      - "generate:api"
    cmds:
      - defer: { task: "test:compose:down" }
      - task: "test:compose:up"
      - pnpm -C server run test --run
