services:
  molci-db:
    image: postgres:17
    container_name: molci-db
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${MOLCI_DB_USER}
      POSTGRES_PASSWORD: ${MOLCI_DB_PASSWORD}
      POSTGRES_DB: ${MOLCI_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - molci_postgres_data:/var/lib/postgresql/data

  gitea-db:
    image: postgres:17
    container_name: gitea-db
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_DB: ${GITEA_DB_NAME}
    ports:
      - "5430:5432"
    volumes:
      - gitea_postgres_data:/var/lib/postgresql/data
    networks:
      - molci_network

  gitea:
    image: docker.gitea.com/gitea:1.24.5
    container_name: gitea
    depends_on:
      - gitea-db
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWORD: ${GITEA_DB_PASSWORD}
      GITEA__server__HTTP_PORT: 3001
      GITEA__webhook__ALLOWED_HOST_LIST: external,loopback,private
    ports:
      - "3001:3001"
    volumes:
      - ./gitea:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - molci_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  molci_postgres_data:
  gitea_postgres_data:

networks:
  molci_network:
    driver: bridge